<!DOCTYPE html>
<html>
<head>
    <title>Таблица лидеров</title>
    {% load static %}
    <link rel="stylesheet" type="text/css" href="{% static 'planets/style.css' %}">
</head>
<body>
    <div class="container">
        <h1>Квиз завершен!</h1>
        <p>Вы ответили правильно на {{ correct_answers }} из {{ total_questions }} вопросов.</p>
        <form method="post" action="{% url 'submit_leaderboard' %}">
            {% csrf_token %}
            <label for="name">Введите ваше имя:</label>
            <input type="text" id="name" name="name" required>
            <button type="submit">Отправить</button>
        </form>
        <a href="{% url 'index' %}" class="back-button">Начать заново</a>
    </div>
</body>
</html>
